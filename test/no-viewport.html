<!DOCTYPE html>
<!-- Setup check for scripts/measure.js: no viewport meta tag. In a mobile context (is_mobile) Chromium lays this page out
     at 980 px, so measure.js must warn "viewport-meta-missing" and, with expectWidth, "viewport-width-mismatch". -->
<html lang="en">
<head><meta charset="utf-8"><title>No viewport meta</title></head>
<body><main><h1>No viewport meta</h1><p>Plain page.</p></main></body>
</html>
